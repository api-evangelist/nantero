aid: nantero
name: Nantero
description: >-
  Nantero, Inc. was a Woburn, Massachusetts nanotechnology company founded in 2001 by Greg
  Schmergel, Thomas Rueckes and Brent Segal to commercialize NRAM, a high-density non-volatile
  random-access memory that stores bits in the physical position of carbon nanotubes deposited
  on a conventional CMOS substrate. Its business was semiconductor intellectual-property
  licensing, not software: it raised more than $40 million through a Schlumberger-backed Series D
  in 2013 and a further ~$31.5 million Series E in 2015 from investors including Charles River
  Ventures and Draper Fisher Jurvetson, licensed NRAM to Fujitsu Semiconductor in 2016, granted
  Lockheed Martin an exclusive government-applications license in 2008, and collaborated with imec
  and Nano-C, but shipped its technology to foundry partners as process IP and test wafers rather
  than as any product a developer could call. Nantero ceased operations in mid-to-late 2024; its
  assets were partially acquired by Micron Technology and the remainder sold at auction. It never
  published a developer portal, API, SDK, or machine-readable specification of any kind, and the
  nantero.com domain has since been re-registered by an unrelated party. This profile is retained
  as a historical record; there is no API surface to enrich.
